<div class="audit-trail-card">
    <div class="audit-trail-header">
        <div class="audit-title-group">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <h3>Agent Workflow Audit Trail</h3>
        </div>
        <span class="audit-count">{{ workflow.audit_trail|length }} State Transitions Recorded</span>
    </div>

    <div class="timeline-list">
        {% for event in workflow.audit_trail %}
        <div class="timeline-item">
            <div class="timeline-marker"></div>
            <div class="timeline-content">
                <div class="timeline-header">
                    <span class="timeline-agent">{{ event.agent_name }}</span>
                    <span class="state-transition-tag">
                        {% if event.from_state %}
                        <span class="state-chip state-chip-prev">{{ event.from_state }}</span> &rarr;
                        {% endif %}
                        <span class="state-chip state-chip-curr state-{{ event.to_state }}">{{ event.to_state }}</span>
                    </span>
                    <span class="timeline-time">{{ event.timestamp }}</span>
                </div>
                <p class="timeline-message">{{ event.message }}</p>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
